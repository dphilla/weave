version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
  - package-ecosystem: gomod
    directory: /go/weave-wazero
    schedule:
      interval: monthly
    labels:
      - dependencies
  - package-ecosystem: gomod
    directory: /sidecars/webrtc
    schedule:
      interval: monthly
    labels:
      - dependencies
  - package-ecosystem: maven
    directory: /java/weave-endive
    schedule:
      interval: monthly
    labels:
      - dependencies
    ignore:
      # JUnit 6 needs Java 17; the adapter keeps Endive's Java 11 baseline.
      - dependency-name: org.junit.jupiter:junit-jupiter
        update-types: ["version-update:semver-major"]
