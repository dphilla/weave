name: Pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
      - run: .github/ci/run-unit.sh rust

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          node: "true"
      - run: .github/ci/run-unit.sh js

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          go: "true"
      - run: .github/ci/run-unit.sh go
      - name: Validate centralized CI definitions
        run: .github/ci/check-workflows.sh

  rust-quality:
    name: Rust formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
      - run: .github/ci/run-unit.sh rust-quality

  conformance:
    name: Representative migration conformance
    needs: [rust, rust-quality, javascript, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - name: Run PR migration cycle and chain
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/pr/conformance
        run: .github/ci/conformance.sh --suite pr
      - name: Check fixed guest semantics across native runtimes
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/pr/semantics
          WEAVE_WAZERO_BIN: ${{ runner.temp }}/weave-ci/pr/conformance/bin/weave-wazero
        run: .github/ci/semantic-conformance.sh native --skip-build
      - name: Check checkpoint-file restore in a fresh process
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/pr/checkpoint
        run: .github/ci/checkpoint-file.sh
      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-conformance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/pr
          if-no-files-found: warn
          retention-days: 7
