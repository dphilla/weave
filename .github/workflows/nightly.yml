name: Nightly adversity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  protocol:
    name: Protocol failure-path tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - run: .github/ci/adversity.sh protocol

  migration-cuts:
    name: Workload-progress migration cuts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
      - name: Repeat after three emission thresholds
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/adversity
        run: .github/ci/adversity.sh migration
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-migration-cuts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/adversity
          if-no-files-found: warn
          retention-days: 30

  multi-memory:
    name: Wasmtime to WAMR to Wasmtime multi-memory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
      - name: Fetch verified WAMR source
        run: |
          .github/ci/prepare-wamr.sh "$RUNNER_TEMP/wasm-micro-runtime" | tee "$RUNNER_TEMP/wamr.env"
          grep '^WAMR_ROOT=' "$RUNNER_TEMP/wamr.env" >> "$GITHUB_ENV"
      - run: .github/ci/run-wamr.sh
      - name: Run focused chain
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/multi-memory
        run: .github/ci/wamr-fixture.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-multi-memory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/multi-memory
          if-no-files-found: warn
          retention-days: 30

  browser:
    name: Required real Chrome round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
      - name: Fetch verified WAMR source
        run: |
          .github/ci/prepare-wamr.sh "$RUNNER_TEMP/wasm-micro-runtime" | tee "$RUNNER_TEMP/wamr.env"
          grep '^WAMR_ROOT=' "$RUNNER_TEMP/wamr.env" >> "$GITHUB_ENV"
      - name: Run browser chain
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/browser
        run: .github/ci/browser-smoke.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/browser
          if-no-files-found: warn
          retention-days: 30

  host-service-baseline:
    name: Built-in host-service baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - run: .github/ci/host-service-baseline.sh

  go-race:
    name: Go race instrumentation (advisory)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          go: "true"
      - env:
          WEAVE_CI_GO_RACE: "1"
        run: .github/ci/run-unit.sh go
