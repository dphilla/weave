name: Weekly WebAssembly corpus

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  transformer-corpus:
    name: Official core testsuite transformer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
      - name: Extract, transform, and validate valid spec modules
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/spec-corpus
        run: .github/ci/spec-corpus.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-spec-corpus-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/spec-corpus
          if-no-files-found: warn
          retention-days: 30
