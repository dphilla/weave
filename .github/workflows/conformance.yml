name: Main conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  language-gates:
    name: Main language and workflow gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - run: .github/ci/run-unit.sh all
      - run: .github/ci/check-workflows.sh

  native:
    name: Native pairs and Rust/LLVM guest
    needs: language-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - name: Run nine Wasmtime/Node/wazero directions
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/native/pairs
        run: .github/ci/conformance.sh --suite native
      - name: Build and migrate the Rust/LLVM guest
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/native/rust-guest
        run: .github/ci/rust-guest.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/native
          if-no-files-found: warn
          retention-days: 30

  wamr:
    name: WAMR tests and directed pairs
    needs: language-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - name: Verify build prerequisites
        run: |
          cmake --version
          cc --version
      - name: Fetch verified WAMR source
        run: |
          .github/ci/prepare-wamr.sh "$RUNNER_TEMP/wasm-micro-runtime" | tee "$RUNNER_TEMP/wamr.env"
          grep '^WAMR_ROOT=' "$RUNNER_TEMP/wamr.env" >> "$GITHUB_ENV"
      - name: Test the independent WAMR workspace
        run: .github/ci/run-wamr.sh
      - name: Run all seven WAMR directions
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/wamr
        run: .github/ci/conformance.sh --suite wamr
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-wamr-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/wamr
          if-no-files-found: warn
          retention-days: 30

  browser:
    name: Required Chrome migration round trips
    needs: language-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
      - name: Fetch verified WAMR source
        run: |
          .github/ci/prepare-wamr.sh "$RUNNER_TEMP/wasm-micro-runtime" | tee "$RUNNER_TEMP/wamr.env"
          grep '^WAMR_ROOT=' "$RUNNER_TEMP/wamr.env" >> "$GITHUB_ENV"
      - name: Run required real-browser migration smoke
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/browser
        run: .github/ci/browser-smoke.sh
      - name: Run browser-to-browser WebRTC smoke
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/browser/peer
        run: .github/ci/browser-peer-smoke.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/browser
          if-no-files-found: warn
          retention-days: 30
