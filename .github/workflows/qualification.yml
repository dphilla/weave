name: Release qualification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  qualify:
    name: Deterministic non-publishing runtime qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/ci/setup
        with:
          rust: "true"
          node: "true"
          go: "true"
      - name: Fetch verified WAMR source
        run: |
          .github/ci/prepare-wamr.sh "$RUNNER_TEMP/wasm-micro-runtime" | tee "$RUNNER_TEMP/wamr.env"
          grep '^WAMR_ROOT=' "$RUNNER_TEMP/wamr.env" >> "$GITHUB_ENV"
      - name: Run deterministic runtime qualification
        env:
          WEAVE_CI_ARTIFACT_DIR: ${{ runner.temp }}/weave-ci/qualification
        run: .github/ci/qualification.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-ci/qualification
          if-no-files-found: warn
          retention-days: 90
